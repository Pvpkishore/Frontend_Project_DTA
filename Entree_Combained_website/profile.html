<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrée | My Profile</title>
    <link rel="icon" type="image/png" href="HeaderSvgs/Logoname.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            color: #303542;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px clamp(20px, 7vw, 88px);
            background: #fff;
            box-shadow: 0 2px 10px rgba(16, 41, 92, .08);
        }

        header img {
            width: 160px;
            height: auto;
        }

        header a {
            color: #10295c;
            font-weight: 700;
            text-decoration: none;
        }

        main {
            width: min(860px, calc(100% - 40px));
            margin: 48px auto;
        }

        h1 {
            margin: 0 0 26px;
            color: #10295c;
            font-size: clamp(28px, 4vw, 40px);
        }

        .profile-card {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 32px;
            padding: 32px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 4px 18px rgba(16, 41, 92, .08);
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #e8eef9;
            color: #10295c;
            font-size: 54px;
            font-weight: 700;
        }

        h2 {
            margin: 0 0 8px;
            color: #10295c;
            font-size: 25px;
        }

        .account-id {
            margin: 0 0 24px;
            color: #64718a;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .detail {
            padding: 15px;
            border-radius: 10px;
            background: #f5f7fb;
        }

        .detail span {
            display: block;
            margin-bottom: 6px;
            color: #64718a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .detail strong {
            color: #303542;
        }

        .edit-button {
            display: inline-block;
            margin-top: 26px;
            padding: 12px 22px;
            border-radius: 22px;
            background: #10295c;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .edit-button:hover {
            background: #1d4b96;
        }

        @media (max-width: 620px) {
            .profile-card {
                grid-template-columns: 1fr;
            }

            .avatar {
                width: 110px;
                height: 110px;
                font-size: 40px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="HeaderSvgs/Logoname.png" alt="Entrée">
        <a href="Combinedpages.html">← Back to Home</a>
    </header>
    <main>
        <h1>My Profile</h1>
        <section class="profile-card" aria-label="Profile information">
            <div class="avatar" aria-hidden="true">J</div>
            <div>
                <h2>Juanis Kitchen</h2>
                <p class="account-id">Customer account · #40164567</p>
                <div class="details">
                    <div class="detail"><span>Contact person</span><strong>Juanis Kitchen</strong></div>
                    <div class="detail"><span>Email</span><strong>juanis@kitchen.com</strong></div>
                    <div class="detail"><span>Phone</span><strong>+91 98765 43210</strong></div>
                    <div class="detail"><span>Account status</span><strong>Active</strong></div>
                </div>
                <a class="edit-button" href="mailto:juanis@kitchen.com?subject=Profile%20Update">EDIT PROFILE</a>
            </div>
        </section>
    </main>
</body>

</html>
